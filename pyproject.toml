[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialektike"
version = "0.2.0a0"
description = "Dialektikḗ — human-governed multi-model dialectic review platform (personal, local, single-user)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.116",
]

[project.optional-dependencies]
macos-release = [
    "pyinstaller==6.21.0",
]

[project.scripts]
dialektike = "dialektike.cli:main"
dialektike-sidecar = "dialektike.sidecar:main"

[tool.dialektike]
display-name = "Dialektikḗ"
emblem = "Διαλεκτική"

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "dialektike", "dialektike.*"]
namespaces = true
